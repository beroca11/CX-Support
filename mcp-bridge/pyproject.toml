[project]
name = "ees-mcp-bridge"
version = "0.1.0"
description = "Fast cached MCP bridge for EES Google Workspace tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "mcp>=1.6.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
]

[project.scripts]
bridge = "bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bridge*"]
